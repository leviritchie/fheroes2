name: Build iOS IPA

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/Build-ios.yml'
      - 'ios/**'
      - 'script/demo/**'
      - 'script/ios/**'
      - 'files/soundfonts/**'
      - 'files/timidity/**'
  workflow_dispatch:
    inputs:
      include_demo_data:
        description: Bundle the free Heroes II demo data into the IPA when local game data is absent.
        required: true
        default: true
        type: boolean
      bundle_identifier:
        description: iOS bundle identifier to build into the app.
        required: true
        default: io.github.leviritchie.fheroes2
        type: string
      development_team:
        description: Optional Apple development team ID. Leave empty to build an unsigned IPA for sideload signing tools.
        required: false
        default: ''
        type: string

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build IPA
        env:
          WORKFLOW_INCLUDE_DEMO_DATA: ${{ inputs.include_demo_data }}
          WORKFLOW_BUNDLE_IDENTIFIER: ${{ inputs.bundle_identifier }}
          WORKFLOW_DEVELOPMENT_TEAM: ${{ inputs.development_team }}
        run: |
          export FHEROES2_IOS_INCLUDE_DEMO_DATA="${WORKFLOW_INCLUDE_DEMO_DATA:-true}"
          export FHEROES2_IOS_BUNDLE_IDENTIFIER="${WORKFLOW_BUNDLE_IDENTIFIER:-io.github.leviritchie.fheroes2}"
          export FHEROES2_IOS_DEVELOPMENT_TEAM="${WORKFLOW_DEVELOPMENT_TEAM:-}"
          bash ./script/ios/build_ipa.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fheroes2-ipa
          path: ios/build/fheroes2.ipa
