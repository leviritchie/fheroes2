name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build iOS archive
        run: |
          cd ios
          xcodebuild \
            -project fheroes2.xcodeproj \
            -scheme fheroes2 \
            -configuration Release \
            -sdk iphoneos \
            archive \
            -archivePath $PWD/build/fheroes2.xcarchive \
            CODE_SIGNING_ALLOWED=NO

      - name: Export unsigned IPA
        run: |
          cd ios
          mkdir -p build/ipa
          cp -r build/fheroes2.xcarchive/Products/Applications/*.app build/ipa/
          cd build/ipa
          zip -r fheroes2.ipa *.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fheroes2-ipa
          path: ios/build/ipa/fheroes2.ipa
