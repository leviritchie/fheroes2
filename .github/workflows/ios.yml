name: iOS

on:
  workflow_dispatch:

jobs:
  ios:
    name: iOS Device Build
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4

    - name: Check Xcode version
      run: xcodebuild -version

    - name: Install dependencies
      run: ./script/ios/install_packages.sh

    - name: Prepare build
      run: |
        mkdir anim
        mkdir data
        mkdir music

    - name: Archive (device build, no signing)
      run: |
        cd ios
        xcodebuild \
          -project fheroes2.xcodeproj \
          -scheme fheroes2 \
          -configuration Release \
          -sdk iphoneos \
          -destination 'generic/platform=iOS' \
          archive \
          -archivePath $PWD/build/fheroes2.xcarchive \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          EXCLUDED_SOURCE_FILE_NAMES="SDL2/src/misc/macosx/*"

    - name: Create IPA
      run: |
        cd ios
        mkdir -p build/ipa/Payload
        cp -r build/fheroes2.xcarchive/Products/Applications/*.app build/ipa/Payload/
        cd build/ipa
        zip -r fheroes2.ipa Payload

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: fheroes2-ipa
        path: ios/build/ipa/fheroes2.ipa
