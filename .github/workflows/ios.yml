name: iOS

on:
  workflow_dispatch:
    inputs:
      include_demo_data:
        description: Bundle the free Heroes II demo data into the IPA when local game data is absent.
        required: true
        default: true
        type: boolean
      bundle_identifier:
        description: iOS bundle identifier to build into the app.
        required: true
        default: io.github.leviritchie.fheroes2
        type: string
      development_team:
        description: Optional Apple development team ID. Leave empty to build an unsigned IPA for sideload signing tools.
        required: false
        default: ''
        type: string

jobs:
  ios:
    name: iOS Device Build
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4

    - name: Check Xcode version
      run: xcodebuild -version

    - name: Build IPA
      env:
        FHEROES2_IOS_INCLUDE_DEMO_DATA: ${{ inputs.include_demo_data }}
        FHEROES2_IOS_BUNDLE_IDENTIFIER: ${{ inputs.bundle_identifier }}
        FHEROES2_IOS_DEVELOPMENT_TEAM: ${{ inputs.development_team }}
      run: bash ./script/ios/build_ipa.sh

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: fheroes2-ipa
        path: ios/build/fheroes2.ipa
